<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Text2Test AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 24px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            color: #d1d5db;
        }

        .container {
            width: min(1100px, 94%);
            margin: 30px auto;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .upload-box {
            border: 2px dashed #9ca3af;
            border-radius: 12px;
            padding: 35px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 20px;
        }

        .upload-box:hover {
            border-color: #2563eb;
            background: #f8fbff;
        }

        .upload-box strong {
            display: block;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .upload-box span {
            color: #6b7280;
        }

        input[type="file"] {
            display: none;
        }

        .file-name {
            margin-top: 12px;
            font-size: 14px;
            color: #374151;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .primary:hover:not(:disabled) {
            background: #1d4ed8;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .secondary:hover:not(:disabled) {
            background: #d1d5db;
        }

        .success {
            background: #16a34a;
            color: white;
        }

        .success:hover:not(:disabled) {
            background: #15803d;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.info {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .status.success-status {
            background: #f0fdf4;
            color: #15803d;
        }

        .status.error-status {
            background: #fef2f2;
            color: #b91c1c;
        }

        .question-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 18px;
            background: #fafafa;
        }

        .question-title {
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .option {
            padding: 9px 12px;
            margin: 7px 0;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: white;
        }

        .answer {
            margin-top: 12px;
            padding: 10px;
            background: #ecfdf5;
            border-radius: 8px;
            color: #166534;
            font-size: 14px;
        }

        .question-meta {
            margin-top: 10px;
            color: #6b7280;
            font-size: 13px;
        }

        .library-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .exam-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px;
            background: white;
        }

        .exam-card h3 {
            margin: 0 0 10px;
        }

        .exam-card p {
            margin: 6px 0;
            color: #6b7280;
            font-size: 14px;
        }

        .exam-card .buttons {
            margin-top: 14px;
        }

        .hidden {
            display: none !important;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        .score-box {
            text-align: center;
            padding: 25px;
            border-radius: 12px;
            background: #eff6ff;
        }

        .score-box h2 {
            margin-bottom: 8px;
        }

        @media (max-width: 700px) {
            .form-grid,
            .library-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Text2Test AI</h1>
    <p>Upload your textbook PDF to create an intelligent test.</p>
</header>

<div class="container">

    <!-- ========================= -->
    <!-- CREATE TEST -->
    <!-- ========================= -->

    <section class="card">

        <h2>Create a Test</h2>

        <div
            class="upload-box"
            id="uploadBox"
        >
            <strong>Choose your PDF</strong>
            <span>Click here to select a textbook PDF</span>

            <input
                type="file"
                id="fileInput"
                accept=".pdf,application/pdf"
            >

            <div
                class="file-name"
                id="fileName"
            ></div>
        </div>

        <div class="form-grid">

            <div class="form-group">
                <label for="subject">
                    Subject
                </label>

                <select id="subject">
                    <option value="">
                        Loading subjects...
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="grade">
                    Grade
                </label>

                <input
                    type="text"
                    id="grade"
                    placeholder="e.g. Grade 10"
                >
            </div>

            <div class="form-group">
                <label for="topic">
                    Topic
                </label>

                <input
                    type="text"
                    id="topic"
                    placeholder="e.g. Genetics"
                >
            </div>

            <div class="form-group">
                <label for="examType">
                    Exam Type
                </label>

                <select id="examType">
                    <option value="Practice Test">
                        Practice Test
                    </option>

                    <option value="Quiz">
                        Quiz
                    </option>

                    <option value="Midterm">
                        Midterm
                    </option>

                    <option value="Final Exam">
                        Final Exam
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="year">
                    Year
                </label>

                <input
                    type="number"
                    id="year"
                    placeholder="e.g. 2026"
                    value="2026"
                >
            </div>

            <div class="form-group">
                <label for="questionCount">
                    Number of Questions
                </label>

                <input
                    type="number"
                    id="questionCount"
                    min="10"
                    max="40"
                    value="20"
                >
            </div>

            <div class="form-group">
                <label for="difficulty">
                    Difficulty
                </label>

                <select id="difficulty">
                    <option value="easy">
                        Easy
                    </option>

                    <option value="medium" selected>
                        Medium
                    </option>

                    <option value="hard">
                        Hard
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="questionType">
                    Question Type
                </label>

                <select id="questionType">
                    <option value="multiple_choice">
                        Multiple Choice
                    </option>

                    <option value="true_false">
                        True / False
                    </option>

                    <option value="short_answer">
                        Short Answer
                    </option>
                </select>
            </div>

            <div class="form-group full">
                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Optional description for this test..."
                ></textarea>
            </div>

        </div>

        <div class="buttons">

            <button
                class="primary"
                id="generateBtn"
            >
                Generate Test
            </button>

            <button
                class="secondary"
                id="clearBtn"
            >
                Clear
            </button>

        </div>

        <div
            id="status"
            class="status"
        ></div>

    </section>


    <!-- ========================= -->
    <!-- GENERATED TEST -->
    <!-- ========================= -->

    <section
        class="card hidden"
        id="generatedSection"
    >

        <h2>Generated Test</h2>

        <div id="questionsContainer"></div>

        <div class="buttons">

            <button
                class="success"
                id="saveExamBtn"
            >
                Save Exam
            </button>

            <button
                class="secondary"
                id="finishBtn"
            >
                Finish Test
            </button>

        </div>

    </section>


    <!-- ========================= -->
    <!-- SAVE EXAM -->
    <!-- ========================= -->

    <section
        class="card hidden"
        id="saveExamSection"
    >

        <h2>Save Exam</h2>

        <div class="form-grid">

            <div class="form-group full">

                <label for="saveTitle">
                    Exam Title
                </label>

                <input
                    type="text"
                    id="saveTitle"
                    placeholder="Enter exam title"
                >

            </div>

        </div>

        <div class="buttons">

            <button
                class="success"
                id="confirmSaveBtn"
            >
                Save Exam
            </button>

            <button
                class="secondary"
                id="cancelSaveBtn"
            >
                Cancel
            </button>

        </div>

        <div
            id="saveStatus"
            class="status"
        ></div>

    </section>


    <!-- ========================= -->
    <!-- RESULT -->
    <!-- ========================= -->

    <section
        class="card hidden"
        id="resultSection"
    >

        <h2>Test Result</h2>

        <div
            id="scoreBox"
            class="score-box"
        ></div>

        <div class="buttons">

            <button
                class="primary"
                id="newTestBtn"
            >
                Create New Test
            </button>

        </div>

    </section>


    <!-- ========================= -->
    <!-- TEST LIBRARY -->
    <!-- ========================= -->

    <section class="card">

        <h2>Test Library</h2>

        <div class="buttons">

            <button
                class="primary"
                id="refreshLibraryBtn"
            >
                Refresh Library
            </button>

        </div>

        <div
            id="libraryContainer"
            class="library-grid"
            style="margin-top:20px;"
        ></div>

    </section>


    <!-- ========================= -->
    <!-- OPEN SAVED EXAM -->
    <!-- ========================= -->

    <section
        class="card hidden"
        id="libraryExamSection"
    >

        <h2 id="libraryExamTitle">
            Saved Exam
        </h2>

        <div id="libraryExamInfo"></div>

        <div id="libraryQuestionsContainer"></div>

        <div class="buttons">

            <button
                class="primary"
                id="reuseBtn"
            >
                Use This Test
            </button>

            <button
                class="secondary"
                id="closeLibraryExamBtn"
            >
                Close
            </button>

        </div>

    </section>

</div>


<script>

    /* =========================================================
       CONFIGURATION
    ========================================================= */

    const BACKEND_URL =
        "https://text2test-backend.onrender.com";

    const UPLOAD_URL =
        BACKEND_URL + "/upload-pdf";

    const SAVE_EXAM_URL =
        BACKEND_URL + "/save-exam";

    const SAVE_QUESTIONS_URL =
        BACKEND_URL + "/questions";

    const SUBJECTS_URL =
        BACKEND_URL + "/subjects";

    const EXAMS_URL =
        BACKEND_URL + "/exams";


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const uploadBox =
        document.getElementById("uploadBox");

    const fileInput =
        document.getElementById("fileInput");

    const fileName =
        document.getElementById("fileName");

    const subject =
        document.getElementById("subject");

    const grade =
        document.getElementById("grade");

    const topic =
        document.getElementById("topic");

    const examType =
        document.getElementById("examType");

    const year =
        document.getElementById("year");

    const questionCount =
        document.getElementById("questionCount");

    const difficulty =
        document.getElementById("difficulty");

    const questionType =
        document.getElementById("questionType");

    const description =
        document.getElementById("description");

    const generateBtn =
        document.getElementById("generateBtn");

    const clearBtn =
        document.getElementById("clearBtn");

    const status =
        document.getElementById("status");

    const generatedSection =
        document.getElementById("generatedSection");

    const questionsContainer =
        document.getElementById("questionsContainer");

    const saveExamBtn =
        document.getElementById("saveExamBtn");

    const finishBtn =
        document.getElementById("finishBtn");

    const saveExamSection =
        document.getElementById("saveExamSection");

    const saveTitle =
        document.getElementById("saveTitle");

    const confirmSaveBtn =
        document.getElementById("confirmSaveBtn");

    const cancelSaveBtn =
        document.getElementById("cancelSaveBtn");

    const saveStatus =
        document.getElementById("saveStatus");

    const resultSection =
        document.getElementById("resultSection");

    const scoreBox =
        document.getElementById("scoreBox");

    const newTestBtn =
        document.getElementById("newTestBtn");

    const refreshLibraryBtn =
        document.getElementById("refreshLibraryBtn");

    const libraryContainer =
        document.getElementById("libraryContainer");

    const libraryExamSection =
        document.getElementById("libraryExamSection");

    const libraryExamTitle =
        document.getElementById("libraryExamTitle");

    const libraryExamInfo =
        document.getElementById("libraryExamInfo");

    const libraryQuestionsContainer =
        document.getElementById(
            "libraryQuestionsContainer"
        );

    const reuseBtn =
        document.getElementById("reuseBtn");

    const closeLibraryExamBtn =
        document.getElementById(
            "closeLibraryExamBtn"
        );


    /* =========================================================
       STATE
    ========================================================= */

    let selectedFile = null;

    let questions = [];

    let currentLibraryExam = null;

    let currentLibraryQuestions = [];


    /* =========================================================
       STATUS
    ========================================================= */

    function showStatus(
        message,
        type = "info"
    ) {

        status.textContent = message;

        status.className =
            "status show " +
            (
                type === "success"
                    ? "success-status"
                    : type === "error"
                        ? "error-status"
                        : "info"
            );
    }


    function showSaveStatus(
        message,
        type = "info"
    ) {

        saveStatus.textContent = message;

        saveStatus.className =
            "status show " +
            (
                type === "success"
                    ? "success-status"
                    : type === "error"
                        ? "error-status"
                        : "info"
            );
    }


    /* =========================================================
       UPLOAD BOX
    ========================================================= */

    uploadBox.addEventListener(
        "click",
        function() {

            fileInput.click();

        }
    );


    fileInput.addEventListener(
        "change",
        function() {

            if (!fileInput.files.length) {

                selectedFile = null;

                fileName.textContent = "";

                return;
            }

            selectedFile =
                fileInput.files[0];

            fileName.textContent =
                "Selected file: " +
                selectedFile.name;
        }
    );


    /* =========================================================
       LOAD SUBJECTS
    ========================================================= */

    async function loadSubjects() {

        subject.innerHTML =
            '<option value="">Loading subjects...</option>';

        try {

            const response =
                await fetch(SUBJECTS_URL);

            const data =
                await response.json();

            console.log(
                "SUBJECTS RESPONSE:",
                data
            );

            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    data.error ||
                    "Could not load subjects."
                );
            }

            const subjects =
                Array.isArray(data)
                    ? data
                    : data.subjects || [];

            subject.innerHTML =
                '<option value="">Select a subject</option>';

            subjects.forEach(
                function(item) {

                    const id =
                        item.id;

                    const name =
                        item.Name ||
                        item.name ||
                        item.subject_name ||
                        "Unknown Subject";

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value = id;

                    option.textContent = name;

                    subject.appendChild(
                        option
                    );
                }
            );

            if (subjects.length === 0) {

                subject.innerHTML =
                    '<option value="">No subjects found</option>';
            }

        } catch (error) {

            console.error(
                "LOAD SUBJECTS ERROR:",
                error
            );

            subject.innerHTML =
                '<option value="">Could not load subjects</option>';

            showStatus(
                "Could not load subjects. Please check the backend.",
                "error"
            );
        }
    }


    /* =========================================================
       PARSE AI RESPONSE
       Supports:
       MCQ
       True / False
       Short Answer
       ========================================================= */

    function parseAIQuestions(
        text,
        selectedType
    ) {

        const cleaned =
            String(text || "")
                .replace(/\r/g, "")
                .trim();

        if (!cleaned) {

            return [];
        }

        console.log(
            "PARSING AI RESPONSE:",
            cleaned
        );


        /*
         * First try to split using Question 1 / 1. / 1)
         */

        let blocks =
            cleaned.split(
                /(?=(?:^|\n)\s*(?:(?:Question|Q)\s*)?\d+\s*[\.\):\-])/gi
            );


        /*
         * Remove empty blocks
         */

        blocks =
            blocks
                .map(
                    block =>
                        block.trim()
                )
                .filter(
                    block =>
                        block.length > 10
                );


        /*
         * If Gemini did not number questions,
         * split by blank lines before Question.
         */

        if (blocks.length <= 1) {

            blocks =
                cleaned.split(
                    /\n\s*\n(?=\s*(?:Question|Q)?\s*\d*[\.\):\-]?\s*)/gi
                );

            blocks =
                blocks
                    .map(
                        block =>
                            block.trim()
                    )
                    .filter(
                        block =>
                            block.length > 10
                    );
        }


        /*
         * Last fallback:
         * split before "Question:"
         */

        if (blocks.length <= 1) {

            blocks =
                cleaned.split(
                    /(?=\n\s*Question\s*[:\-])/gi
                );

            blocks =
                blocks
                    .map(
                        block =>
                            block.trim()
                    )
                    .filter(
                        block =>
                            block.length > 10
                    );
        }


        console.log(
            "QUESTION BLOCKS:",
            blocks
        );


        const parsed = [];


        blocks.forEach(
            function(block, index) {

                try {

                    let working =
                        block
                            .replace(
                                /^\s*(?:Question|Q)?\s*\d+\s*[\.\):\-]\s*/i,
                                ""
                            )
                            .trim();


                    /*
                     * Extract answer first.
                     */

                    let answer = "";


                    const answerMatch =
                        working.match(
                            /(?:Answer|Correct Answer|Correct)\s*[:\-]\s*(?:Option\s*)?([A-D]|True|False)\b/i
                        );


                    if (answerMatch) {

                        answer =
                            answerMatch[1].trim();
                    }


                    /*
                     * Short answer may contain
                     * a longer answer.
                     */

                    if (
                        selectedType ===
                        "short_answer" &&
                        !answer
                    ) {

                        const shortMatch =
                            working.match(
                                /(?:Answer|Correct Answer|Correct)\s*[:\-]\s*(.+)$/is
                            );

                        if (shortMatch) {

                            answer =
                                shortMatch[1]
                                    .trim();
                        }
                    }


                    /*
                     * Extract MCQ options.
                     */

                    const options = {};

                    const optionRegex =
                        /(?:^|\n)\s*([A-D])[\.\):\-]\s*(.+?)(?=\n\s*[A-D][\.\):\-]|\n\s*(?:Answer|Correct Answer|Correct)\s*[:\-]|$)/gis;


                    let match;


                    while (
                        (
                            match =
                            optionRegex.exec(
                                working
                            )
                        ) !== null
                    ) {

                        const letter =
                            match[1]
                                .toUpperCase();

                        const optionText =
                            match[2]
                                .trim()
                                .replace(
                                    /\*\*/g,
                                    ""
                                );

                        if (
                            optionText
                        ) {

                            options[
                                letter
                            ] =
                                optionText;
                        }
                    }


                    /*
                     * Remove options from question text.
                     */

                    let questionText =
                        working;


                    questionText =
                        questionText.replace(
                            /(?:^|\n)\s*[A-D][\.\):\-]\s*.+?(?=\n\s*[A-D][\.\):\-]|\n\s*(?:Answer|Correct Answer|Correct)\s*[:\-]|$)/gis,
                            ""
                        );


                    /*
                     * Remove answer.
                     */

                    questionText =
                        questionText.replace(
                            /(?:Answer|Correct Answer|Correct)\s*[:\-].*$/is,
                            ""
                        );


                    /*
                     * Remove "Question:"
                     */

                    questionText =
                        questionText.replace(
                            /^\s*(?:Question|Q)\s*[:\-]\s*/i,
                            ""
                        );


                    /*
                     * Remove markdown.
                     */

                    questionText =
                        questionText
                            .replace(
                                /\*\*/g,
                                ""
                            )
                            .replace(
                                /^[-*]\s+/,
                                ""
                            )
                            .trim();


                    if (
                        questionText.length < 5
                    ) {

                        return;
                    }


                    /*
                     * Multiple Choice
                     */

                    if (
                        Object.keys(
                            options
                        ).length >= 2
                    ) {

                        parsed.push({

                            question:
                                questionText,

                            options:
                                options,

                            answer:
                                answer,

                            difficulty:
                                difficulty.value,

                            question_type:
                                "multiple_choice",

                            topic:
                                topic.value ||
                                "General"
                        });

                        return;
                    }


                    /*
                     * True / False
                     */

                    if (
                        selectedType ===
                        "true_false"
                    ) {

                        const tfMatch =
                            working.match(
                                /(?:Answer|Correct Answer|Correct)\s*[:\-]\s*(True|False)/i
                            );

                        let tfAnswer =
                            answer;

                        if (
                            !tfAnswer &&
                            tfMatch
                        ) {

                            tfAnswer =
                                tfMatch[1];
                        }

                        if (
                            /^(true|false)$/i.test(
                                tfAnswer
                            )
                        ) {

                            parsed.push({

                                question:
                                    questionText,

                                options: {
                                    True:
                                        "True",
                                    False:
                                        "False"
                                },

                                answer:
                                    tfAnswer,

                                difficulty:
                                    difficulty.value,

                                question_type:
                                    "true_false",

                                topic:
                                    topic.value ||
                                    "General"
                            });

                            return;
                        }
                    }


                    /*
                     * Short Answer
                     */

                    if (
                        selectedType ===
                        "short_answer"
                    ) {

                        if (
                            answer
                        ) {

                            parsed.push({

                                question:
                                    questionText,

                                options: {},

                                answer:
                                    answer,

                                difficulty:
                                    difficulty.value,

                                question_type:
                                    "short_answer",

                                topic:
                                    topic.value ||
                                    "General"
                            });
                        }
                    }

                } catch (error) {

                    console.error(
                        "Could not parse question block:",
                        index,
                        error,
                        block
                    );
                }
            }
        );


        return parsed;
    }


    /* =========================================================
       RENDER QUESTIONS
       ========================================================= */

    function renderQuestions() {

        questionsContainer.innerHTML = "";

        if (
            !Array.isArray(questions) ||
            questions.length === 0
        ) {

            questionsContainer.innerHTML =
                '<div class="empty">No questions generated.</div>';

            return;
        }


        questions.forEach(
            function(q, index) {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "question-card";


                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "question-title";

                title.textContent =
                    `${index + 1}. ${q.question}`;


                card.appendChild(
                    title
                );


                if (
                    q.options &&
                    Object.keys(q.options).length
                ) {

                    Object.entries(
                        q.options
                    ).forEach(
                        function([
                            key,
                            value
                        ]) {

                            const option =
                                document.createElement(
                                    "div"
                                );

                            option.className =
                                "option";

                            option.textContent =
                                `${key}. ${value}`;

                            card.appendChild(
                                option
                            );
                        }
                    );
                }


                const meta =
                    document.createElement(
                        "div"
                    );

                meta.className =
                    "question-meta";

                meta.textContent =
                    `Type: ${q.question_type} | Difficulty: ${q.difficulty}`;

                card.appendChild(
                    meta
                );


                const answer =
                    document.createElement(
                        "div"
                    );

                answer.className =
                    "answer";

                answer.textContent =
                    "Correct Answer: " +
                    (
                        q.answer ||
                        "Not provided"
                    );

                card.appendChild(
                    answer
                );


                questionsContainer.appendChild(
                    card
                );
            }
        );
    }


    /* =========================================================
       GENERATE TEST
       ========================================================= */

    generateBtn.addEventListener(
        "click",
        async function() {

            try {

                if (!selectedFile) {

                    showStatus(
                        "Please select a PDF file first.",
                        "error"
                    );

                    return;
                }


                let count =
                    parseInt(
                        questionCount.value,
                        10
                    );


                if (
                    isNaN(count)
                ) {

                    count = 20;
                }


                count =
                    Math.max(
                        10,
                        Math.min(
                            count,
                            40
                        )
                    );


                questionCount.value =
                    count;


                if (!subject.value) {

                    showStatus(
                        "Please select a subject.",
                        "error"
                    );

                    return;
                }


                generateBtn.disabled =
                    true;

                generateBtn.textContent =
                    "Generating...";


                showStatus(
                    "Uploading PDF and generating questions with AI...",
                    "info"
                );


                const formData =
                    new FormData();


                formData.append(
                    "pdf",
                    selectedFile
                );


                formData.append(
                    "question_count",
                    String(count)
                );


                formData.append(
                    "difficulty",
                    difficulty.value
                );


                formData.append(
                    "question_type",
                    questionType.value
                );


                const response =
                    await fetch(
                        UPLOAD_URL,
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const rawText =
                    await response.text();


                console.log(
                    "RAW GENERATE RESPONSE:",
                    rawText
                );


                let data;


                try {

                    data =
                        JSON.parse(
                            rawText
                        );

                } catch (parseError) {

                    throw new Error(
                        "Backend returned invalid JSON: " +
                        rawText.substring(
                            0,
                            500
                        )
                    );
                }


                console.log(
                    "FULL GENERATE RESPONSE:",
                    data
                );


                if (
                    !response.ok ||
                    data.success === false
                ) {

                    throw new Error(
                        data.error ||
                        data.message ||
                        data.detail ||
                        "AI generation failed."
                    );
                }


                /*
                 * IMPORTANT:
                 * Backend returns generated AI text
                 * inside data.test
                 */

                const aiText =
                    String(
                        data.test ||
                        data.generated_text ||
                        data.text ||
                        ""
                    ).trim();


                console.log(
                    "FULL AI RESPONSE:",
                    aiText
                );


                if (!aiText) {

                    throw new Error(
                        "Gemini returned an empty response."
                    );
                }


                questions =
                    parseAIQuestions(
                        aiText,
                        questionType.value
                    );


                console.log(
                    "PARSED QUESTIONS:",
                    questions
                );


                if (
                    !Array.isArray(
                        questions
                    ) ||
                    questions.length === 0
                ) {

                    console.error(
                        "AI TEXT THAT FAILED TO PARSE:",
                        aiText
                    );

                    throw new Error(
                        "The AI response contains no readable questions. Check the browser console for the full AI response."
                    );
                }


                renderQuestions();


                generatedSection.classList.remove(
                    "hidden"
                );


                saveExamSection.classList.add(
                    "hidden"
                );


                resultSection.classList.add(
                    "hidden"
                );


                generatedSection.scrollIntoView({
                    behavior: "smooth"
                });


                showStatus(
                    `Successfully generated ${questions.length} questions.`,
                    "success"
                );


            } catch (error) {

                console.error(
                    "GENERATE ERROR:",
                    error
                );

                showStatus(
                    error.message ||
                    "AI generation failed.",
                    "error"
                );

            } finally {

                generateBtn.disabled =
                    false;

                generateBtn.textContent =
                    "Generate Test";
            }
        }
    );

                /*

    finishBtn.addEventListener(
        "click",
        function() {

            if (
                !questions.length
            ) {

                return;
            }


            let correct = 0;


            questions.forEach(
                function(q, index) {

                    const selected =
                        document.querySelector(
                            `[data-answer="${index}"]:checked`
                        );


                    if (!selected) {

                        return;
                    }


                    const userAnswer =
                        selected.value
                            .trim()
                            .toLowerCase();


                    const correctAnswer =
                        String(
                            q.answer || ""
                        )
                            .trim()
                            .toLowerCase();


                    if (
                        userAnswer ===
                        correctAnswer
                    ) {

                        correct++;
                    }
                }
            );


            const percentage =
                Math.round(
                    (
                        correct /
                        questions.length
                    ) *
                    100
                );


            scoreBox.innerHTML = `
                <h2>${correct} / ${questions.length}</h2>
                <p>Score: ${percentage}%</p>
            `;


            resultSection.classList.remove(
                "hidden"
            );


            resultSection.scrollIntoView({
                behavior: "smooth"
            });
        }
    );

                    "Invalid JSON from /exams."
                );

            ) {

                throw new Error(
                    data.error ||

    /* =========================================================
       RENDER LIBRARY QUESTIONS
       ========================================================= */

    function renderLibraryQuestions() {

        libraryQuestionsContainer.innerHTML =
            "";


        if (
            !currentLibraryQuestions.length
        ) {

            libraryQuestionsContainer.innerHTML =
                `
                <div class="empty">
                    No questions found for this test.
                </div>
                `;

            return;
        }


        currentLibraryQuestions.forEach(
            function(q, index) {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "question-card";


                let optionsHTML =
                    "";


                if (
                    q.options
                ) {

                    let options =
                        q.options;


                    /*
                     * Sometimes Supabase may return
                     * JSON as a string.
                     */

                    if (
                        typeof options ===
                        "string"
                    ) {

                        try {

                            options =
                                JSON.parse(
                                    options
                                );

                        } catch (error) {

                            options = {};
                        }
                    }


                    Object.entries(
                        options
                    ).forEach(
                        function([
                            key,
                            value
                        ]) {

                            optionsHTML +=
                                `
                                <div class="option">
                                    <strong>
                                        ${escapeHtml(
                                            key
                                        )}.
                                    </strong>
                                    ${escapeHtml(
                                        String(
                                            value
                                        )
                                    )}
                                </div>
                                `;
                        }
                    );
                }


                card.innerHTML = `

                    <div class="question-title">

                        ${index + 1}.
                        ${escapeHtml(
                            q.question ||
                            ""
                        )}

                    </div>

                    ${optionsHTML}

                    <div class="question-meta">

                        Type:
                        ${escapeHtml(
                            q.question_type ||
                            "unknown"
                        )}

                        |
                        Difficulty:
                        ${escapeHtml(
                            q.difficulty ||
                            "unknown"
                        )}

                    </div>

                    <div class="answer">

                        Correct Answer:
                        ${escapeHtml(
                            String(
                                q.answer ||
                                ""
                            )
                        )}

                    </div>
                `;


                libraryQuestionsContainer.appendChild(
                    card
                );
            }
        );
    }

    reuseBtn.addEventListener(
        "click",
        function() {

            if (
                !currentLibraryQuestions.length
            ) {

                return;
            }


            questions =
                currentLibraryQuestions.map(
                    function(q) {

                        let options =
                            q.options;


                        if (
                            typeof options ===
                            "string"
                        ) {

                            try {

                                options =
                                    JSON.parse(
                                        options
                                    );

                            } catch (error) {

                                options = {};
                            }
                        }


                        return {

                            question:
                                q.question,

                            options:
                                options || {},

                            answer:
                                q.answer || "",

                            difficulty:
                                q.difficulty ||
                                "medium",

                            question_type:
                                q.question_type ||
                                "multiple_choice",

                            topic:
                                topic.value ||
                                "General"
                        };
                    }
                );


            renderQuestions();


            generatedSection.classList.remove(
                "hidden"
            );


            resultSection.classList.add(
                "hidden"
            );


            saveExamSection.classList.add(
                "hidden"
            );


            libraryExamSection.classList.add(
                "hidden"
            );


            generatedSection.scrollIntoView({
                behavior: "smooth"
            });


            showStatus(
                "Saved test loaded successfully. You can use it as a new test.",
                "success"
            );
        }
    );


    /* =========================================================
       CLOSE LIBRARY EXAM
       ========================================================= */

    closeLibraryExamBtn.addEventListener(
        "click",
        function() {

            libraryExamSection.classList.add(
                "hidden"
            );
        }
    );


    /* =========================================================
       REFRESH LIBRARY
       ========================================================= */

    refreshLibraryBtn.addEventListener(
        "click",
        async function() {

            refreshLibraryBtn.disabled =
                true;

            refreshLibraryBtn.textContent =
                "Loading...";


            try {

                await loadLibrary();

            } finally {

                refreshLibraryBtn.disabled =
                    false;

                refreshLibraryBtn.textContent =
                    "Refresh Library";
            }
        }
    );


    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }


    /* =========================================================
       INITIALIZATION
       ========================================================= */

    async function initialize() {

        console.log(
            "Text2Test AI frontend loaded successfully."
        );


        await loadSubjects();

        await loadLibrary();
    }


    initialize();

</script>

</body>
</html>
